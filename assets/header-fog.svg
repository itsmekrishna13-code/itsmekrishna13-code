<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0a2e"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#164e63"/>
    </linearGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <linearGradient id="txtg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a5f3fc"/>
    </linearGradient>
    <radialGradient id="blob1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="320" fill="url(#bg)"/>

  <g filter="url(#blur)">

    <circle cx="200" cy="150" r="220" fill="url(#blob1)">
      <animate attributeName="cx" dur="18s" repeatCount="indefinite" values="150;350;150"/>
      <animate attributeName="cy" dur="14s" repeatCount="indefinite" values="120;220;120"/>
    </circle>

    <circle cx="800" cy="120" r="240" fill="url(#blob2)">
      <animate attributeName="cx" dur="20s" repeatCount="indefinite" values="850;620;850"/>
      <animate attributeName="cy" dur="16s" repeatCount="indefinite" values="100;240;100"/>
    </circle>

    <circle cx="500" cy="280" r="200" fill="url(#blob3)">
      <animate attributeName="cx" dur="16s" repeatCount="indefinite" values="380;620;380"/>
      <animate attributeName="cy" dur="18s" repeatCount="indefinite" values="280;160;280"/>
    </circle>

  </g>

  <text x="500" y="165" font-family="Arial, sans-serif" font-size="58" font-weight="bold"
        text-anchor="middle" fill="url(#txtg)">
    Krishna Singh
    <animate attributeName="opacity" values="0.85;1;0.85" dur="4s" repeatCount="indefinite"/>
  </text>

  <text x="500" y="210" font-family="Arial, sans-serif" font-size="19" font-weight="500"
        text-anchor="middle" fill="#cffafe">
    BSc Data Science | Python | ML | AI | Data
    <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
  </text>
</svg>
